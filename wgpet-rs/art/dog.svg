<?xml version="1.0" encoding="UTF-8"?>
<!--
  wgpet 狗狗零件图 —— 这是**绘制源**, 不是渲染器(见 AGENTS-DETAIL §D55)。

  怎么用:
    · 直接用 Inkscape 打开改轮廓, 存盘 -> `cargo build --release --offline`
      (`src/art.rs` 里 `include_str!("../art/dog.svg")` 编译期就嵌进 DLL, 单文件交付不变)
    · 只认 `id`(零件名) 与 `fill="none"`(只描边的开放图形, 例如鼻梁线)。
      `fill` / `stroke` / `stroke-width` 这些颜色一律**忽略** —— 真正上色的是 `art.rs` 里的
      调色板与"体积球"径向渐变笔刷(它们要跟着 pose 走)。这里写颜色只是让你在编辑器里看着顺眼。
    · 支持的 d 命令: M m L l H h V v C c S s Q q T t A a Z z
      (Inkscape 的"对象转路径"给矩形/圆是 A —— 已支持; 铅笔/贝塞尔是 C)

  坐标约定(和 rust 侧完全一样, 别改):
    · y **向下为正**, 每个零件都在**自己的局部坐标系**里, 原点由 rust 侧按 pose 摆
      (所以在这张图里所有零件都叠在原点附近 —— 摆放是姿态的事, 不是零件的事)
    · 单位 = 像素(scale=1 时); 头会在 rust 侧再乘 1.34 的"头身比"缩放

  改完记得看一眼 DLL 的初始化日志: 它会打 "art: svg …" 一行, 把 SVG 与内置路径的包围盒差报出来
  (差不为 0 不一定是错 —— 你改过形状它就该变; 但它能立刻抓出"解析失败悄悄退回内置路径")。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="-30 -35 80 60">
  <!-- 头: 圆颅骨(柴犬的"大额头"), 朝右 -->
  <path id="head"
        d="M -14 -19 C -6 -30 10 -30 18 -17 C 23 -11 25 -4 24 2 C 22 9 12 13 -1 12.5 C -11 12 -18 4 -14 -19 Z"
        fill="#f49a34" stroke="#2e1b13" stroke-width="2" stroke-linejoin="round"/>

  <!-- 耳: 厚三角立耳, 底边宽 ≈ 高度 -->
  <path id="ear"
        d="M -9.5 2 C -9.5 -8 -6.5 -16.5 0 -20.5 C 6.5 -16.5 9.5 -8 9.5 2 C 5 4.6 -5 4.6 -9.5 2 Z"
        fill="#f49a34" stroke="#2e1b13" stroke-width="2" stroke-linejoin="round"/>

  <!-- 身体: 桶形(背线平直 + 深胸 + 收腰), x 全体按 0.88 向中心压缩过 -> Q版短身子 -->
  <path id="body"
        d="M 26.7 -77 C 12.6 -82 -9.4 -82 -24.4 -76 C -37.6 -71 -41.1 -58 -40.2 -45 C -39.3 -33 -32.3 -27 -21.7 -27 C -10.3 -31 0.3 -32 10 -29 C 19.6 -26 25.8 -28 27.6 -37 C 30.2 -49 31.1 -66 26.7 -77 Z"
        fill="#f49a34" stroke="#2e1b13" stroke-width="2.3" stroke-linejoin="round"/>

  <!-- 吻: 从颅骨前下方伸出来的短圆楔; 后缘是向脸内凹的浅弧(不是竖直直线!) -->
  <path id="muzzle"
        d="M 13.5 -6 C 20 -7.5 28 -4 32 0 C 34.5 3.5 32 8 26.5 9 C 20 9.8 16 8 14 4.5 C 12.4 2 12 -2.5 13.5 -6 Z"
        fill="#fff4da" stroke="#2e1b13" stroke-width="1.9" stroke-linejoin="round"/>

  <!-- 嘴: 张开的笑口(月牙) -->
  <path id="mouth"
        d="M 28 3.4 C 27 7.4 23 9.4 19 8.8 C 17 8.4 15.8 6.8 16.2 5 C 20 5.4 24.5 4.6 28 3.4 Z"
        fill="#661a19" stroke="#2e1b13" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- 鼻梁线: 只描边、不闭合(fill=none -> 开放图形) -->
  <path id="bridge"
        d="M 27.5 -1 C 24 -5.2 17 -6.8 9 -6"
        fill="none" stroke="#2e1b13" stroke-width="1.9" stroke-linecap="round"/>
</svg>
