<?xml version="1.0" encoding="UTF-8"?>
<!--
  wgpet 狗狗零件图 —— 这是**绘制源**, 不是渲染器(见 AGENTS-DETAIL §D55)。

  形象来源: 用户给的**柴犬姿态图**(站立/坐姿/趴卧/活动/其他 五组共 30 个姿势, 见 CHANGELOG 第九十轮补五)。
  这里只画"侧面偏三分之四"那一套零件(引擎就一种视角, 靠 face 镜像左右) —— 轮廓取姿态图的**侧面**,
  脸取**正面斜45°**: 白脸罩(颊+眼周) + 额头那道橙 V + 眉上两点 + 小圆黑眼 + 小三角黑鼻 + 张嘴笑。

  怎么用:
    · 直接用 Inkscape 打开改轮廓, 存盘 -> `cargo build --release --offline`
      (`src/art.rs` 里 `include_str!("../art/dog.svg")` 编译期就嵌进 DLL, 单文件交付不变)
    · 只认 `id`(零件名) 与 `fill="none"`(只描边的开放图形, 例如鼻梁线)。
      `fill` / `stroke` / `stroke-width` 这些颜色一律**忽略** —— 真正上色的是 `art.rs` 里的
      调色板与"体积球"径向渐变笔刷(它们要跟着 pose 走)。这里写颜色只是让你在编辑器里看着顺眼。
    · 零件: head(颅骨+吻, 一个闭合轮廓) / mask(白脸罩) / mouth(张开的嘴) / bridge(鼻梁线)
      / ear(耳) / body(身子)。**mask 与 mouth 都是"盖在 head 上"的**。
    · 支持的 d 命令: M m L l H h V v C c S s Q q T t A a Z z
      (Inkscape 的"对象转路径"给矩形/圆是 A —— 已支持; 铅笔/贝塞尔是 C)

  坐标约定(和 rust 侧完全一样, 别改):
    · y **向下为正**, 每个零件都在**自己的局部坐标系**里, 原点由 rust 侧按 pose 摆
      (所以在这张图里所有零件都叠在原点附近 —— 摆放是姿态的事, 不是零件的事)
    · 单位 = 像素(scale=1 时); 头会在 rust 侧再乘 1.34 的"头身比"缩放

  改完记得看一眼 DLL 的初始化日志: 它会打 "art: svg …" 一行, 把 SVG 与内置路径的包围盒差报出来
  (差不为 0 不一定是错 —— 你改过形状它就该变; 但它能立刻抓出"解析失败悄悄退回内置路径")。

  参考色(从姿态图取样, 真正的值在 art.rs 的调色板):
    背毛 #eb953c / 里白 #fdf2e0 / 描边 #6b3d1a / 鼻眼 #0f1111 / 舌 #f1836c / 耳内 #fbd1aa
-->
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280" viewBox="-40 -45 95 70">
  <!-- 头: 圆颅骨 + 前下方伸出来的短吻(一个闭合轮廓; 五官都相对它摆) -->
  <path id="head"
        d="M -15 -12 C -14 -24.5 -4 -29.5 7 -27 C 16.5 -24.5 21.5 -18 23 -9.5 C 24.5 -3 27.5 0 31 1.5 C 34.5 3.2 34 7.5 30 9 C 25.5 10.6 20 10.4 15.5 9.2 C 9.5 12 1 13.4 -5.5 12.2 C -11.5 11 -15 6 -15.2 0 C -15.4 -4.5 -15.2 -8.5 -15 -12 Z"
        fill="#eb953c" stroke="#6b3d1a" stroke-width="2" stroke-linejoin="round"/>

  <!-- 白脸罩(里白): 颊 + **眼周**(眼睛必须坐在这块白里, 参考图就是这样) + 吻, 顶上留一道窄橙 V -->
  <path id="mask"
        d="M -13 8.5 C -6 12 3 12.5 9.5 10.5 C 15 8.6 21 6 24.5 2.5 C 26 0.5 25.5 -3 23.5 -6.5 C 21.5 -11 19 -16 14 -18 C 10 -19.5 6 -19.5 3.5 -17.5 C 2.5 -16 1.5 -16 0 -17.5 C -2 -19.5 -6 -19.5 -9.5 -18 C -13 -16.5 -15.5 -11 -15.5 -5 C -15.5 1 -14.5 5.5 -13 8.5 Z"
        fill="#fdf2e0"/>

  <!-- 嘴: 鼻子下面的张嘴笑(月牙), 里面再叠舌头 -->
  <path id="mouth"
        d="M 26 3.6 C 25.5 6.6 23 8.8 20 8.6 C 18 8.4 16.5 7.2 16.1 5.4 C 19.1 5.6 23 4.9 26 3.6 Z"
        fill="#7a2a20" stroke="#6b3d1a" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 鼻梁线: 从鼻根往后上方回到眼下方(只描边, 不闭合) -->
  <path id="bridge"
        d="M 27 -0.4 C 23 -3.4 17 -5 11 -4.6"
        fill="none" stroke="#6b3d1a" stroke-width="1.7" stroke-linecap="round"/>

  <!-- 耳: 厚三角立耳(底宽 ≈ 高度的 0.8), 尖端略圆; 耳根坐在颅顶 -->
  <path id="ear"
        d="M -9.5 2.5 C -10 -7.5 -6.5 -15.5 0 -19.5 C 6.5 -15.5 10 -7.5 9.5 2.5 C 5 5.2 -5 5.2 -9.5 2.5 Z"
        fill="#eb953c" stroke="#6b3d1a" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- 身子: 桶形(背线平直 + 深胸 + 轻微收腰), 长度按 Q版压缩过 -->
  <path id="body"
        d="M 26.7 -77 C 12.6 -82 -9.4 -82 -24.4 -76 C -37.6 -71 -41.1 -58 -40.2 -45 C -39.3 -33 -32.3 -27 -21.7 -27 C -10.3 -31 0.3 -32 10 -29 C 19.6 -26 25.8 -28 27.6 -37 C 30.2 -49 31.1 -66 26.7 -77 Z"
        fill="#eb953c" stroke="#6b3d1a" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
