[package]
name = "wgpet"
version = "0.1.0"
edition = "2021"
description = "WgIme 桌面宠物浮层 (wgpet.dll) — Direct2D + DirectComposition 逐像素 alpha"
publish = false

[lib]
name = "wgpet"
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.58", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# panic=unwind: 每个 FFI 边界都要 catch_unwind, 崩溃不许跨过 DLL 边界把宿主(输入法)带走
[profile.release]
opt-level = 3
panic = "unwind"
lto = false
